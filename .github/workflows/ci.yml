# Chaque sous-projet est validé séparément pour localiser immédiatement une
# régression. Les actions sont épinglées par SHA pour figer la chaîne CI.
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - 'chore/**'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check frontend project exists
        id: check
        run: echo "exists=$(test -f frontend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check backend project exists
        id: check
        run: echo "exists=$(test -f backend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test -- --ci
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skuup
          POSTGRES_PASSWORD: e2e-password
          POSTGRES_DB: skuup_test
        options: >-
          --health-cmd="pg_isready -U skuup -d skuup_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run guarded E2E suites
        working-directory: backend
        env:
          DATABASE_URL: postgresql://skuup:e2e-password@localhost:5432/skuup_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-only-jwt-secret
        shell: bash
        run: |
          set -euo pipefail

          run_e2e_suite() {
            local suite_path="$1"
            local active_guard="$2"
            local announcement_guard=0
            local auth_guard=0
            local extension_guard=0
            local daily_checkin_guard=0
            local raffle_draw_guard=0
            local watch_session_heartbeat_guard=0
            local scratch_card_no_win_guard=0

            case "$active_guard" in
              announcement) announcement_guard=1 ;;
              auth) auth_guard=1 ;;
              extension) extension_guard=1 ;;
              daily-checkin) daily_checkin_guard=1 ;;
              raffle-draw) raffle_draw_guard=1 ;;
              watch-session-heartbeat) watch_session_heartbeat_guard=1 ;;
              scratch-card-no-win) scratch_card_no_win_guard=1 ;;
              *) echo "Unknown E2E guard: $active_guard" >&2; return 64 ;;
            esac

            E2E_SUITE="$suite_path" \
              ANNOUNCEMENT_E2E_ALLOW_DATABASE="$announcement_guard" \
              AUTH_E2E_ALLOW_DATABASE="$auth_guard" \
              EXTENSION_E2E_ALLOW_DATABASE="$extension_guard" \
              DAILY_CHECKIN_E2E_ALLOW_DATABASE="$daily_checkin_guard" \
              RAFFLE_DRAW_E2E_ALLOW_DATABASE="$raffle_draw_guard" \
              WATCH_SESSION_HEARTBEAT_E2E_ALLOW_DATABASE="$watch_session_heartbeat_guard" \
              SCRATCH_CARD_NO_WIN_E2E_ALLOW_DATABASE="$scratch_card_no_win_guard" \
              sh scripts/run-isolated-e2e-suite.sh
          }

          run_e2e_suite test/announcements-lifecycle.e2e-spec.ts announcement
          run_e2e_suite test/auth-lifecycle.e2e-spec.ts auth
          run_e2e_suite test/extension-pairing.e2e-spec.ts extension
          run_e2e_suite test/daily-checkin.e2e-spec.ts daily-checkin
          run_e2e_suite test/raffle-admin-draw.e2e-spec.ts raffle-draw
          run_e2e_suite test/watch-session-heartbeat.e2e-spec.ts watch-session-heartbeat
          run_e2e_suite test/scratch-card-no-win.e2e-spec.ts scratch-card-no-win

  frontend-e2e:
    name: Frontend responsive and accessibility smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run responsive and accessibility smoke tests
        working-directory: frontend
        env:
          # Keep this job self-contained: Playwright starts the frontend from
          # the checked-out commit through its webServer configuration. A
          # dedicated port avoids collisions with the staging stack on the
          # checked-out commit without accidentally testing another deploy.
          QA_PORT: "3210"
        run: npm run test:e2e
      - name: Upload dashboard design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-v3-design-captures
          path: frontend/test-results/dash-v3-design
          if-no-files-found: warn
          retention-days: 14

  extension:
    name: Extension navigateur (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check extension project exists
        id: check
        run: echo "exists=$(test -f extension/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: extension/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: extension
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: extension
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: extension
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: extension
        run: npm test
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: extension
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check compose file exists
        id: check
        run: echo "exists=$(test -f docker-compose.yml && test -f frontend/Dockerfile && test -f backend/Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Prepare build-only environment
        if: steps.check.outputs.exists == 'true'
        run: cp .env.example .env
      - name: Validate Dokploy production compose isolation
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          export POSTGRES_USER=skuup
          export POSTGRES_PASSWORD=ci-only-password
          export POSTGRES_DB=skuup
          export DATABASE_URL=postgresql://skuup:ci-only-password@postgres:5432/skuup
          export REDIS_PASSWORD=ci-only-redis-password
          export REDIS_URL=redis://:ci-only-redis-password@redis:6379
          export JWT_SECRET=ci-only-jwt-secret
          export CORS_ORIGINS=http://localhost:3000
          export NEXT_PUBLIC_API_URL=http://localhost:3000
          compose_json="$(docker compose -f docker-compose.dokploy.yml config --format json)"
          printf '%s' "$compose_json" | jq -e '
            ([.services[] | select(.ports != null)] | length == 0) and
            (.networks.data.internal == true) and
            (.services.backend.environment.COOKIE_SECURE == "true")
          ' >/dev/null
          local_json="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --format json)"
          printf '%s' "$local_json" | jq -e '
            (
              (.services.frontend.ports[0] == "127.0.0.1:3000:3000") or
              (
                (.services.frontend.ports[0].host_ip == "127.0.0.1") and
                (.services.frontend.ports[0].published|tostring == "3000") and
                (.services.frontend.ports[0].target|tostring == "3000")
              )
            ) and
            (
              (.services.backend.ports[0] == "127.0.0.1:3001:3000") or
              (
                (.services.backend.ports[0].host_ip == "127.0.0.1") and
                (.services.backend.ports[0].published|tostring == "3001") and
                (.services.backend.ports[0].target|tostring == "3000")
              )
            ) and
            (.services.backend.environment.COOKIE_SECURE == "false")
          ' >/dev/null
          prod_backend_cookie="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json | jq -r '.services.backend.environment.COOKIE_SECURE // empty')"
          test "$prod_backend_cookie" = "true"
          echo "Production compose keeps service ports private, the data network internal, and session cookies secure."
      - name: Build images (no push)
        if: steps.check.outputs.exists == 'true'
        run: docker compose build
