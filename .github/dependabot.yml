version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/backend"
      - "/frontend"
      - "/extension"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      github-actions:
        patterns:
          - "*"
