# Déploiement Dokploy. Ce fichier est autonome et n'embarque pas Traefik :
# Dokploy assure le routage, les certificats TLS et l'accès public.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Le frontend staging doit joindre le backend exposé par son domaine
        # Dokploy dédié, pas le domaine qui sert les pages Next.js.
        NEXT_PUBLIC_API_URL: "https://api-staging.skkup.fr"
    environment:
      NEXT_PUBLIC_API_URL: "https://api-staging.skkup.fr"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: skuup-backend:production
    environment:
      DATABASE_URL: "${DATABASE_URL:?obligatoire}"
      REDIS_URL: "${REDIS_URL:?obligatoire}"
      JWT_SECRET: "${JWT_SECRET:?obligatoire}"
      CORS_ORIGINS: "${CORS_ORIGINS:?obligatoire}"
      COOKIE_SECURE: "true"
      # Un seul proxy Dokploy est autorisé à fournir l'adresse du client.
      TRUSTED_PROXY_HOPS: "1"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - data
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    image: skuup-backend:production
    pull_policy: never
    command: ["node", "dist/src/worker"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?obligatoire}"
      REDIS_URL: "${REDIS_URL:?obligatoire}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const net=require('node:net');const urls=[new URL(process.env.REDIS_URL),new URL(process.env.DATABASE_URL)];Promise.all(urls.map(u=>new Promise((ok,ko)=>{const s=net.connect(Number(u.port),u.hostname,()=>{s.end();ok()});s.setTimeout(2000,()=>s.destroy(new Error('timeout')));s.on('error',ko)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: skuup-backend:production
    pull_policy: never
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?obligatoire}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?obligatoire}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?obligatoire}"
      POSTGRES_DB: "${POSTGRES_DB:?obligatoire}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command:
      - "sh"
      - "-c"
      - "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?obligatoire}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?obligatoire}"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:

networks:
  public:
  data:
    internal: true
