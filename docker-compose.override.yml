# Chargé automatiquement par "docker compose up" en local (développement).
# Expose les services directement sur des ports locaux pour ne pas dépendre
# d'un nom de domaine ni de Traefik pendant le développement.
services:
  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Le développement local utilise aussi des cookies sécurisés.
      COOKIE_SECURE: "true"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
