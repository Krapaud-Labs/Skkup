# Chargé automatiquement par "docker compose up" en local (développement).
# Expose les services directement sur des ports locaux pour ne pas dépendre
# d'un nom de domaine ni de Traefik pendant le développement.
services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: "https://localhost/api"
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skkup-frontend-local.rule=Host(`localhost`)"
      - "traefik.http.routers.skkup-frontend-local.entrypoints=websecure"
      - "traefik.http.routers.skkup-frontend-local.tls=true"
      - "traefik.http.routers.skkup-frontend-local.priority=1"
      - "traefik.http.services.skkup-frontend-local.loadbalancer.server.port=3000"

  backend:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Le développement local est servi en HTTP sur 127.0.0.1:3001.
      # La configuration production conserve COOKIE_SECURE=true.
      COOKIE_SECURE: "false"
      # La matrice QA multi-écrans dépasse le quota de production sur une
      # seule IP. La valeur de production reste 120 requêtes/minute.
      THROTTLE_PREAUTH_LIMIT: "1000"
      THROTTLE_ME_LIMIT: "1000"
      CORS_ORIGINS: "https://localhost"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skkup-backend-local.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.skkup-backend-local.entrypoints=websecure"
      - "traefik.http.routers.skkup-backend-local.tls=true"
      - "traefik.http.routers.skkup-backend-local.priority=100"
      - "traefik.http.routers.skkup-backend-local.middlewares=skkup-backend-local-strip"
      - "traefik.http.middlewares.skkup-backend-local-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.skkup-backend-local.loadbalancer.server.port=3000"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
