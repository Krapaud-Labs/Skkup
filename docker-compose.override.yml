# Chargé automatiquement par "docker compose up" en local (développement).
# Expose les services directement sur des ports locaux pour ne pas dépendre
# d'un nom de domaine ni de Traefik pendant le développement.
services:
  frontend:
    ports:
      - "3000:3000"

  backend:
    ports:
      - "3001:3000"
    environment:
      # Pas de TLS en local : un cookie de session Secure serait rejeté
      # par le navigateur. Uniquement valable ici, jamais en production.
      COOKIE_SECURE: "false"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
