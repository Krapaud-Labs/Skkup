schema_version = 1
project_name = "Skkup"
project_type = "web-platform"
risk_tolerance = "standard"
# autonomous-after-brief ou approval-per-step
execution_mode = "autonomous-after-brief"
# continuous-until-done ou step-by-step
execution_authorization = "continuous-until-done"
integration_branch = "dev"

[stack]
languages = ["TypeScript", "SQL"]
package_manager = "npm"
runtime = "Node.js 26"

[stack.frontend]
enabled = true
framework = "Next.js 16"
ui_library = "React 19, Tailwind CSS 4"
test_framework = "Vitest"

[stack.backend]
enabled = true
framework = "NestJS 11"
api_style = "REST et Socket.io"
test_framework = "Jest"

[stack.database]
enabled = true
engine = "PostgreSQL 16"
orm_or_query_layer = "Prisma 7"
migrations = "Prisma Migrate"

[stack.infrastructure]
containerization = "Docker Compose"
deployment = "VPS Dokploy avec Traefik"
ci_provider = "GitHub Actions"

[stack.security]
authentication = "email/mot de passe, JWT, cookie httpOnly, jeton extension"
authorization = "rôles utilisateur et administrateur, guards NestJS"
secrets_provider = "variables d'environnement du déploiement"

[commands]
install = "npm ci --prefix frontend && npm ci --prefix backend && npm ci --prefix extension"
lint = "npm run lint --prefix frontend && npm run lint --prefix backend && npm run lint --prefix extension"
test = "npm test --prefix frontend -- --run && npm test --prefix backend -- --ci && npm test --prefix extension"
build = "npm run build --prefix frontend && npm run build --prefix backend && npm run build --prefix extension"
security = "bash .codex/scripts/security-baseline.sh"

[capabilities]
frontend = true
backend = true
database = true
authentication = true
deployment = true
ci = true

[agents]
produit = false
qa = true
devops = true
performance = false
ux_research = false
accessibilite = true
data = true
documentation = true
release = true
conformite = true

[tracking]
mode = "integrated"
provider = "Trello"
trello_choice = "enabled"
trello_execution = "always-build"
trello_board_name = "Skkup"
trello_workspace = ""
# Format : [{ name = "Prénom Nom", role = "Rôle projet", trello_id = "" }]
trello_members = [{ name = "Mickael", role = "Product owner" }]
# pending_activation, syncing, verified ou blocked
trello_sync_status = "verified"
trello_board_id = "6a6b9388b666be175d187aee"
trello_board_url = "https://trello.com/b/4GCnzk85/skkup"

[delivery]
uses_pull_requests = true
requires_human_approval_for_critical = true
require_feature_branch = true
max_files_per_commit = 75
max_changed_lines_per_commit = 1200

[updates]
# ask, pr ou off. Le mode pr ouvre une Pull Request automatique.
mode = "pr"
source = "https://github.com/krapaud/AGENTIC-Starter-Kits.git"
