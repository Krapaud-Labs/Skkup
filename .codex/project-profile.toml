schema_version = 1
project_name = "Skkup"
project_type = "web platform with browser extension"
integration_branch = "dev"

[project]
name = "Skkup"
brief_status = "accepted"

[stack]
languages = ["TypeScript"]
package_manager = "npm"
runtime = "Node.js 26"

[stack.frontend]
framework = "Next.js 16.2.12"
ui = "React 19.2.4"
tests = "Vitest"

[stack.backend]
framework = "NestJS 11"
tests = "Jest"
realtime = "Socket.IO"

[stack.database]
database = "PostgreSQL 16"
orm = "Prisma 7"
cache_queue = "Redis 7 and BullMQ"

[stack.extension]
target = "WebExtension"
initial_browser = "Chrome"
build = "esbuild"

[stack.infrastructure]
containers = "Docker Compose"
proxy = "Traefik 3"
deployment = "Dokploy configuration present in repository"

[validation]
frontend = ["npm run lint", "npm run typecheck", "npm test", "npm run build"]
backend = ["npm run lint", "npm run typecheck", "npm test", "npm run build"]
extension = ["npm run lint", "npm run typecheck", "npm test", "npm run build"]

